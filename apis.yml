aid: maxrewards
name: MaxRewards
description: >-
  MaxRewards is a consumer credit-card rewards app for iOS and Android that helps
  people manage their credit cards and maximize the rewards they earn on everyday
  spending. It links a user's cards, tracks spending, automatically activates
  card-linked offers, surfaces personalized card recommendations, compares credit
  cards by rewards rate and welcome offer, and monitors credit scores — all in one
  place — so cardholders earn more cash back and points with less manual effort.
  MaxRewards is an Atlanta-based fintech backed by Techstars. It is a consumer
  product company: it publishes a public marketing site and an internal app API,
  but does not currently expose a public developer API, OpenAPI, SDKs, or a
  developer portal.
